# --- Shared assets ---
shared_assets:
  path: shared-assets/
  owner: blago-nko
  submodule_status: cancelled
  note: "в монорепе git-submodule отменён (решение A1.1); сайты подключают тему relative-mount"
  subdirs:
    hugo/:
      owner: blago-nko
      scope: 13+ Hugo-сайтов
    astro/:
      owner: blago-nko
      scope: VAC, Пантеон, Наша история
    next/:
      owner: can-secure-dev
      scope: SAN platform
    web/:
      owner: blago-nko
      scope: кросс-фреймворк CSS tokens, JS, CookieConsent
    rss/:
      owner: blago-nko
      scope: шаблоны фидов

# --- Overrides (правила агентов, не удалять механически) ---
overrides:
  - id: design_tokens_dead_dup
    path: shared-assets/web/css/design-tokens.css
    rule: "мёртвый дубль .site-logo на самом деле живой override-каскад; не удалять механически без computed-замера и disjoint-!important-анализа"
    owner: shared
    source: KB

  - id: pagefind_glob_preserve
    path: sites/obrazslov/pagefind.yml
    rule: "не менять glob '**/*.html' без перехода на pretty-URLs + 301"
    owner: migration
    expires: "после перехода на pretty URLs"
    source: KB

# --- Rights profiles ---
rights_profiles:
  ecosystem_default:
    code: AGPLv3
    content: CC BY-NC 4.0
    attribution: "blago-nko"
  vac_special:
    text: CC BY 4.0
    code: MIT
    attribution: "Вакуумный конденсат / blago-nko"
    note: "исключение из ЛИЦ.md; более открытая лицензия для научного контента"
  san_original:
    license: CC BY-NC 4.0
    attribution: "САН / blago-nko"
    note: "без ND; ND блокирует CMA-отчёты, переводы, AI-обработку (см. CC BY-NC-ND deed)"
  third_party_commercial_offer:
    license: rights_reserved
    note: "права на исходные коммерческие предложения принадлежат правообладателям; не лицензируются САН"
