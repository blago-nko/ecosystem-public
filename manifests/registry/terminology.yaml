# Принудительная некоммерческая терминология
version: 1
enforcement: mandatory_for_public_docs

# Термины, которые нельзя использовать в публичных документах
# как обозначение услуг, доступа, взносов, отчётов или партнёрских условий.
forbidden_terms:
  - тариф
  - комиссия
  - CPA
  - white-label
  - on-premise
  - SLA
  - premium
  - франшиза
  - партизанский маркетинг
  - бан
  - пожизненный бан

# Фразы, которые нельзя использовать в коммерческом/организационном смысле.
forbidden_phrases:
  - цена тарифа
  - цена взноса
  - цена отчёта
  - цена услуги
  - цена доступа
  - цена подписки
  - стоимость тарифа
  - стоимость взноса
  - стоимость отчёта
  - стоимость услуги
  - стоимость доступа
  - стоимость подписки
  - продажа отчётов
  - продажа данных
  - продажа доступа
  - продажа подписок
  - доход от тарифов
  - доход от взносов
  - доход от отчётов
  - доход от партнёров
  - доход от доступа

# Фактические термины, допустимые в карточках объектов недвижимости.
allowed_fact_terms:
  - цена объекта
  - стоимость объекта
  - статус: продажа
  - статус: аренда
  - доходность
  - рыночная стоимость
  - кадастровая стоимость

# Контекстные исключения: эти слова можно использовать, если они относятся
# к объекту недвижимости, а не к условиям участия, доступу, услугам или отчётам САН.
context_exceptions:
  - terms:
      - цена
      - стоимость
      - продажа
      - доход
    allowed_when: "используются как фактические характеристики объекта недвижимости или инвестиционной аналитики, а не как условия участия/доступа/услуг САН"
    examples:
      - "Цена: 8 500 000 ₽"
      - "Стоимость объекта"
      - "Статус: продажа"
      - "Статус: аренда"
      - "Доходность аренды"
      - "Рыночная стоимость"
      - "Кадастровая стоимость"

approved_terms:
  - уровень участия
  - пакет инфраструктурных взносов
  - целевой взнос
  - возмещение затрат
  - некоммерческое соглашение о сотрудничестве
  - партнёрский доступ к данным
  - аналитические материалы по соглашению
  - партнёрское брендирование
  - развёртывание у партнёра
  - гарантированный уровень доступности в соглашении
  - расширенный уровень участия
  - партнёрская программа
  - приостановка участия
  - исключение из реестра участников

mapping:
  "тариф": "уровень участия"
  "цена тарифа / цена взноса / цена отчёта / цена услуги / цена доступа / цена подписки": "размер целевого взноса / расчёт возмещения затрат"
  "стоимость тарифа / стоимость взноса / стоимость отчёта / стоимость услуги / стоимость доступа / стоимость подписки": "размер целевого взноса / расчёт возмещения затрат"
  "доход от тарифов / доход от взносов / доход от отчётов / доход от партнёров / доход от доступа": "поступление целевых взносов"
  "комиссия": "административное удержание / возмещение расходов"
  "продажа отчётов / продажа данных / продажа доступа / продажа подписок": "предоставление аналитических материалов по соглашению / партнёрский доступ к данным"
  "CPA-маркетплейс": "каталог партнёрских услуг"
  "white-label": "партнёрское брендирование"
  "on-premise": "развёртывание у партнёра"
  "SLA": "гарантированный уровень доступности в соглашении"
  "data licensing": "партнёрский доступ к данным по некоммерческому соглашению"
  "premium": "расширенный уровень участия"
  "франшиза": "партнёрская программа"
  "партизанский маркетинг": "информирование партнёров о возможностях"
  "бан": "приостановка участия"
  "пожизненный бан": "исключение из реестра участников"

exceptions:
  - path: archive/
  - path: audits/
  - path: docs/legacy/
  - path: manifests/САН.md
    reason: "историческая версия до приведения манифеста к новой терминологии"
  - path: manifests/ЛИЦ.md
    reason: "историческая версия до приведения лицензионной терминологии"
