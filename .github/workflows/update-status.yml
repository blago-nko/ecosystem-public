name: Validate STATUS generator manual

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: Run update_status.py and migrated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.3 PyYAML==6.0.2

      - name: Regenerate STATUS.md
        run: python scripts/registry/update_status.py

      - name: Validate STATUS.md structure
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          content = Path('docs/STATUS.md').read_text(encoding='utf-8')

          required = [
              '## Текущее состояние',
              '## Легенда статусов',
              '## Состояние манифестов',
              '## Машиночитаемые реестры',
              '## Ключевые метрики',
              '## Активные риски',
          ]

          missing = [s for s in required if s not in content]
          if missing:
              print('Missing: ' + ', '.join(missing))
              sys.exit(1)

          if not re.search(r'## Состояние \d+ доменов', content):
              print('Dynamic domain section missing')
              sys.exit(1)

          if 'docs/manifests.yaml' in content:
              print('Dead source present')
              sys.exit(1)

          if not re.search(r'\d{2}\.\d{2}\.\d{4}', content):
              print('DD.MM.YYYY timestamp missing')
              sys.exit(1)

          print('STATUS.md structure OK')
          PY

      - name: Run migrated STATUS tests
        run: |
          pytest tests/test_update_status.py tests/snapshots/test_status_structure.py -v

      - name: Show generated diff
        run: |
          git diff -- docs/STATUS.md || true

      - name: Upload generated STATUS artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-STATUS-generated
          path: docs/STATUS.md
